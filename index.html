<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e2c31">
<meta name="description" content="Purify · 다이어트가 아닌, 치유의 길 — 비우고, 쉬고, 다시 새로워지는 몸">

<title>Purify - 정화의 길</title>
<style>
  :root { --p:#b4c9a6; --p2:#8fa77f; --g:#cdb787; --t:#ebe5d6; --m:#a9b4ac; --card:rgba(235,229,214,.05); --line:rgba(235,229,214,.1); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif; background:#192428; color:var(--t); font-size:16px; line-height:1.55; }
  .app { max-width:480px; margin:0 auto; height:100vh; height:100dvh; background:linear-gradient(180deg,#1e2c31 0%,#22333a 55%,#263a3f 100%); position:relative; overflow:hidden; }
  .view { display:none; flex-direction:column; height:100%; position:relative; z-index:1; }
  .view.on { display:flex; }
  .top { display:flex; align-items:center; gap:8px; padding:calc(8px + env(safe-area-inset-top)) 10px 8px; min-height:60px; }
  .brand { flex:1; text-align:center; color:var(--g); font-weight:700; letter-spacing:3px; font-size:15px; }
  .iconbtn { width:48px; height:48px; border-radius:24px; border:none; background:transparent; color:var(--p); font-size:28px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit; }
  .iconbtn.sm { font-size:20px; }
  .iconbtn.hide { visibility:hidden; }
  .dots { flex:1; display:flex; justify-content:center; gap:7px; }
  .dot { width:8px; height:8px; border-radius:4px; background:rgba(255,255,255,.18); transition:all .25s; }
  .dot.done { background:rgba(180,201,166,.55); }
  .dot.on { background:var(--p); width:22px; }
  .body { flex:1; overflow-y:auto; padding:6px 20px 28px; -webkit-overflow-scrolling:touch; }
  .foot { padding:10px 20px calc(16px + env(safe-area-inset-bottom)); }
  h1 { font-size:27px; color:var(--p); line-height:1.35; margin:6px 0 10px; font-weight:700; }
  h2 { font-size:23px; color:var(--p); margin:4px 0 6px; line-height:1.35; }
  h3 { font-size:17.5px; color:var(--t); margin-bottom:6px; }
  .lead { color:var(--m); font-size:15.5px; margin-bottom:18px; }
  .btn { display:block; width:100%; min-height:56px; padding:14px; border:none; border-radius:16px; background:linear-gradient(135deg,var(--p2),var(--p)); color:#17241f; font-weight:700; font-size:17px; cursor:pointer; margin-top:10px; font-family:inherit; }
  .btn:disabled { opacity:.4; }
  .btn.sec { background:transparent; color:var(--p); border:1.5px solid rgba(180,201,166,.6); }
  .btn.ghost { background:rgba(255,255,255,.05); color:var(--t); border:1px solid var(--line); font-weight:600; }
  .btn.sm { min-height:48px; font-size:15.5px; padding:10px; }
  .opt { box-shadow:0 1px 2px rgba(0,0,0,.05); display:block; width:100%; min-height:64px; text-align:left; padding:14px 16px; margin-bottom:12px; border-radius:16px; border:1.5px solid var(--line); background:var(--card); color:var(--t); font-size:17px; cursor:pointer; font-family:inherit; line-height:1.45; }
  .opt small { display:block; color:var(--m); font-size:14px; margin-top:3px; }
  .opt.sel { border-color:var(--p); background:rgba(180,201,166,.14); box-shadow:0 0 0 1px var(--p) inset; }
  .opt.dis { opacity:.5; }
  .seg { display:flex; gap:10px; } .seg .opt { flex:1; text-align:center; margin-bottom:0; }
  label.f { display:block; font-size:14.5px; color:var(--m); margin:16px 0 6px; }
  .inp { width:100%; min-height:54px; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.06); color:var(--t); border:1.5px solid var(--line); font-size:17px; font-family:inherit; }
  .inp:focus { outline:none; border-color:var(--p); }
  textarea.inp { min-height:96px; line-height:1.5; resize:vertical; }
  select.inp { appearance:none; }
  .unit { position:relative; } .unit .inp { padding-right:48px; } .unit span { position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--m); pointer-events:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:22px; box-shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 22px rgba(0,0,0,.08); padding:18px 16px; margin-bottom:14px; }
  .card.hl { border-color:rgba(180,201,166,.55); background:rgba(180,201,166,.08); }
  .verse { font-size:17px; line-height:1.75; }
  .ref { color:var(--g); font-size:14px; margin-top:6px; }
  .explain { background:rgba(255,255,255,.05); border-radius:14px; padding:12px 14px; margin-top:8px; font-size:15.5px; color:#e4ddcd; }
  .apply { margin-top:12px; font-size:15.5px; } .apply b { color:var(--p); }
  .warn { background:rgba(196,120,96,.14); border:1px solid rgba(206,140,116,.5); color:#efcdbf; border-radius:16px; padding:12px 14px; font-size:15px; margin:10px 0; }
  .good { background:rgba(157,184,140,.1); border:1px solid rgba(157,184,140,.4); color:#dbe7d2; border-radius:16px; padding:12px 14px; font-size:15px; margin:10px 0; }
  .muted { color:var(--m); font-size:14.5px; }
  .row { display:flex; gap:10px; align-items:center; }
  .row > .btn { margin-top:0; }
  .grow { flex:1; min-width:0; }
  .stats { display:flex; gap:10px; margin:6px 0; }
  .stat { flex:1; text-align:center; background:rgba(255,255,255,.045); border-radius:16px; padding:12px 4px; }
  .stat b { display:block; font-size:21px; color:var(--p); line-height:1.3; }
  .stat span { font-size:12.5px; color:var(--m); }
  .bar { height:10px; background:rgba(255,255,255,.1); border-radius:5px; overflow:hidden; margin:8px 0; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--p2),var(--p)); transition:width .3s; }
  .item { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid rgba(255,255,255,.07); }
  .item:first-of-type { border-top:none; }
  .item .txt { flex:1; min-width:0; }
  .item .txt b { font-size:16px; }
  .item .txt div { font-size:14.5px; color:#d9d2c3; }
  .item .txt small { color:var(--m); font-size:13px; }
  .ic { font-size:28px; width:36px; text-align:center; flex:none; }
  .tick { flex:none; width:54px; height:54px; border-radius:27px; border:2px solid rgba(180,201,166,.6); background:transparent; color:var(--p); font-size:22px; cursor:pointer; font-family:inherit; }
  .tick.on { background:var(--p); color:#17241f; border-color:var(--p); }
  .chip { display:inline-block; min-height:46px; padding:10px 14px; margin:0 6px 8px 0; border-radius:23px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--t); font-size:15px; cursor:pointer; font-family:inherit; }
  .chip.on { border-color:var(--p); background:rgba(180,201,166,.2); color:var(--p); font-weight:700; }
  .cat { margin:18px 0 10px; padding:12px 14px; border-left:3px solid var(--p); background:rgba(255,255,255,.03); border-radius:0 14px 14px 0; }
  .cat h3 { margin-bottom:4px; } .cat.hl { background:rgba(180,201,166,.12); box-shadow:0 0 0 1px rgba(180,201,166,.4) inset; }
  .sub { margin:-4px 0 14px; padding:12px 14px; border:1px dashed var(--line); border-radius:16px; }
  .btn.stop { background:#a8533f; color:#fbf3ea; }
  .stage { display:flex; gap:6px; margin:8px 0; } .stage span { flex:1; text-align:center; font-size:12.5px; padding:6px 2px; border-radius:10px; background:rgba(255,255,255,.06); color:var(--m); }
  .stage span.on { background:rgba(180,201,166,.25); color:var(--p); font-weight:700; } .stage span.done { color:#a9c79a; }
  .chk { display:flex; align-items:center; gap:14px; min-height:56px; padding:6px 0; border-top:1px solid rgba(255,255,255,.07); font-size:16px; cursor:pointer; }
  .chk:first-of-type { border-top:none; }
  .chk input { width:26px; height:26px; accent-color:#b4c9a6; flex:none; }
  .nav { display:flex; height:calc(68px + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); background:rgba(24,35,39,.97); border-top:1px solid rgba(180,201,166,.25); }
  .nav button { flex:1; border:none; background:transparent; color:var(--m); font-size:13px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .nav button i { font-style:normal; font-size:22px; line-height:1; }
  .nav button.on { color:var(--p); font-weight:700; }
  .afsw { margin-top:12px; padding:12px; border-radius:16px; background:rgba(235,229,214,.04); border:1px solid var(--line); transition:background .6s, border-color .6s; }
  .afsw.on { background:rgba(205,183,135,.10); border-color:rgba(205,183,135,.45); }
  .afsw .knob { position:relative; width:64px; height:32px; border-radius:16px; background:rgba(169,180,172,.25); flex:none; margin-right:10px; }
  .afsw .knob i { position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:13px; background:var(--m); transition:left .5s cubic-bezier(.3,1.4,.5,1), background .5s; }
  .afsw .knob b { position:absolute; top:7px; right:8px; font-size:11px; color:var(--m); }
  .afsw.on .knob { background:rgba(205,183,135,.35); }
  .afsw.on .knob i { left:35px; background:var(--g); box-shadow:0 0 12px rgba(205,183,135,.7); }
  .afsw.on .knob b { left:8px; right:auto; color:#2a2a1f; }
  .afsw.flip { animation:afglow 1.6s ease-out 1; }
  @keyframes afglow { 0% { box-shadow:0 0 0 0 rgba(205,183,135,.6); } 100% { box-shadow:0 0 0 18px rgba(205,183,135,0); } }
  .bar.thin { height:6px; margin-top:10px; }
  .afnote { border-color:rgba(205,183,135,.5); background:rgba(205,183,135,.08); }
  .evi { display:inline-block; font-size:11px; padding:1px 7px; border-radius:9px; margin-left:2px; vertical-align:1px; border:1px solid var(--line); color:var(--m); white-space:nowrap; }
  .evi-h, .evi-ho { color:#cfe0c4; border-color:rgba(157,184,140,.5); }
  .evi-a { color:#e3cfa6; border-color:rgba(205,183,135,.5); }
  .evi-c, .evi-y { color:#c9c3e0; border-color:rgba(190,180,222,.45); }
  .evi-g, .evi-r, .evi-n { color:var(--m); } .evi-x { color:#e7d3c6; border-color:rgba(206,140,116,.45); }
  ul.claims { padding-left:18px; margin:6px 0; } ul.claims li { margin:6px 0; line-height:1.6; }
  #main a, #ob a { color:#c7d6bc; }
  .cite { font-size:12px; color:var(--m); } .cite a, .srcl a, .refs a, .hlinks a { color:#c7d6bc; }
  .srcl { font-size:12px; color:var(--m); line-height:1.5; margin-top:8px; }
  details.hcard { border:1px solid var(--line); border-radius:16px; padding:10px 12px; margin:8px 0; background:rgba(235,229,214,.03); }
  details.hcard summary { cursor:pointer; min-height:28px; }
  details.hcard p { margin:6px 0; line-height:1.6; }
  .care { color:#e7d3c6; }
  .hlinks { font-size:12px; margin:4px 0 0; color:var(--m); }
  .htabs .opt { font-size:13px; padding:8px 4px; }
  ol.refs { padding-left:20px; font-size:12px; line-height:1.5; } ol.refs li { margin:4px 0; word-break:break-all; }
  .chip.lock { opacity:.55; }
  .screen { display:none; } .screen.on { display:block; }
  .toast { position:absolute; left:50%; bottom:96px; transform:translateX(-50%); background:rgba(27,39,43,.97); border:1px solid var(--p); padding:12px 16px; border-radius:16px; z-index:200; opacity:0; transition:opacity .25s; pointer-events:none; width:max-content; max-width:300px; text-align:center; font-size:15px; }
  .toast.show { opacity:1; }
  details > summary { cursor:pointer; color:var(--p); min-height:48px; display:flex; align-items:center; font-weight:600; list-style:none; font-size:15.5px; }
  details > summary::-webkit-details-marker { display:none; }
  details > summary::after { content:'›'; margin-left:auto; font-size:22px; transition:transform .2s; }
  details[open] > summary::after { transform:rotate(90deg); }
  ul.l { margin:6px 0 4px 20px; } ul.l li { margin:4px 0; }
  .badge { display:inline-block; background:linear-gradient(135deg,var(--p2),var(--p)); color:#17241f; font-size:12.5px; font-weight:700; padding:3px 10px; border-radius:20px; margin-left:6px; vertical-align:middle; }
  .tag { display:inline-block; font-size:12.5px; color:var(--p); border:1px solid rgba(180,201,166,.45); padding:2px 9px; border-radius:20px; margin:6px 4px 0 0; }
  .hero { text-align:center; padding-top:9vh; }
  .hero .mark { font-size:56px; color:var(--p); margin-bottom:6px; }
  .hero p { font-size:17.5px; line-height:1.8; margin:14px 0; }
  .timer { font-size:42px; font-weight:300; letter-spacing:2px; text-align:center; color:var(--p); font-variant-numeric:tabular-nums; margin:4px 0; }
  .sec-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
  .sec-title h3 { margin:0; }
  .link { background:none; border:none; color:var(--p); font-size:15px; cursor:pointer; min-height:44px; padding:0 4px; font-family:inherit; }
  .ringwrap { display:flex; align-items:center; gap:16px; }
  .prayer { background:rgba(180,201,166,.08); border-left:3px solid var(--p); border-radius:10px; padding:12px 14px; margin-top:10px; font-size:15.5px; line-height:1.7; }
  .share-pre { white-space:pre-wrap; font-size:14px; background:rgba(0,0,0,.25); border-radius:14px; padding:12px; color:#e4ddcd; max-height:240px; overflow:auto; }
  .member { border-top:1px solid rgba(255,255,255,.07); padding:10px 0; }
  .member .inp { margin-top:8px; min-height:48px; font-size:15.5px; }
  .musicbtn { position:absolute; top:calc(14px + env(safe-area-inset-top)); right:10px; z-index:60; width:44px; height:44px; border-radius:22px; border:1px solid rgba(180,201,166,.45); background:rgba(27,39,43,.75); color:var(--p); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .musicbtn.off { color:var(--m); opacity:.7; }
  .music-mini { position:absolute; top:calc(62px + env(safe-area-inset-top)); right:10px; z-index:59; max-width:min(300px, calc(100% - 20px)); background:rgba(32,30,51,.94); border:1px solid rgba(195,184,227,.35); border-radius:16px; color:#e6e0f2; font-size:13px; box-shadow:0 6px 18px rgba(0,0,0,.18); }
  .music-mini summary { list-style:none; cursor:pointer; padding:8px 12px; display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
  .music-mini summary::-webkit-details-marker { display:none; }
  .music-mini .la1 { color:#aaa4bf; font-style:italic; font-size:12px; }
  .music-mini .mini-body { padding:0 12px 10px; max-height:52vh; overflow:auto; }
  .la { font-style:italic; color:#dbd6e8; margin:8px 0 2px; line-height:1.5; }
  .ko { color:var(--t); margin:0 0 6px; line-height:1.6; }
  .nowplay { margin-top:12px; padding:12px; border-radius:16px; background:rgba(130,118,180,.12); border:1px solid rgba(195,184,227,.25); }
  details.lyr summary { cursor:pointer; color:#c3b8e3; margin-top:8px; min-height:32px; }
  .musicbtn.off::after { content:''; position:absolute; width:26px; height:2px; background:var(--m); transform:rotate(-45deg); border-radius:1px; }
  .toast { white-space:pre-line; line-height:1.5; }
  .vline { font-size:14.5px; line-height:1.65; color:#d8cfb4; margin:10px 0 2px; padding-left:10px; border-left:2px solid rgba(205,183,135,.45); }
  .vline span { color:var(--m); font-size:13px; white-space:nowrap; }
  details.xpl > summary { display:inline-flex; min-height:40px; padding:0 14px; margin:8px 0 2px; border:1px solid rgba(205,183,135,.5); border-radius:999px; background:rgba(205,183,135,.08); font-size:15px; }
  details.xpl > summary small { color:var(--m); font-weight:400; margin-left:6px; font-size:12.5px; }
  details.xpl[open] > summary small { display:none; }
  details.xpl > summary::after { margin-left:8px; font-size:18px; }
  .pcard { margin-bottom:14px; }
  .pcard > .opt { margin-bottom:0; }
  .pcard.sel > .opt { border-bottom-left-radius:6px; border-bottom-right-radius:6px; }
  details.more { margin:4px 2px 0; }
  details.more > summary { min-height:42px; font-size:15px; padding:0 4px; }
  .info { padding:2px 4px 6px; }
  .isec { margin:10px 0 12px; }
  .isec h4 { font-size:14px; color:var(--p); margin:0 0 4px; letter-spacing:.02em; }
  .isec p, .isec li { font-size:15px; line-height:1.6; }
  .stars { color:var(--g); letter-spacing:2px; }
  .cmpwrap { padding-top:6px; }
  table.cmp { width:100%; border-collapse:collapse; font-size:13.5px; line-height:1.45; }
  table.cmp th, table.cmp td { border-bottom:1px solid rgba(255,255,255,.08); padding:8px 4px; text-align:left; vertical-align:top; }
  table.cmp tr:first-child th { color:var(--p); font-size:14px; }
  table.cmp th:first-child { color:var(--m); font-weight:500; width:22%; }
  .devo { margin:22px 0 10px; padding:18px 14px 8px; border-radius:22px; background:linear-gradient(180deg,#2a2740 0%,#201e33 100%); border:1px solid rgba(190,180,222,.32); box-shadow:0 0 0 1px rgba(0,0,0,.2) inset; }
  .devo h3 { color:#e6e0f2; font-size:19px; margin-bottom:8px; letter-spacing:.02em; }
  .devo p { font-size:15px; line-height:1.65; color:#dbd6e8; }
  .devo .muted { color:#aaa4bf; }
  .devo .vline { border-left-color:rgba(190,180,222,.55); color:#e2dcf0; }
  .devo .isec h4 { color:#c3b8e3; }
  .devo details.more > summary { color:#c3b8e3; }
  .devo-card > .opt { background:rgba(130,118,180,.12); border-color:rgba(190,180,222,.35); }
  .devo-card > .opt.sel { border-color:#c3b8e3; box-shadow:0 0 0 2px rgba(195,184,227,.35); }
  .devo-sub .chip.on { background:#c3b8e3; color:#221f33; border-color:#c3b8e3; }
  .tier { background:rgba(0,0,0,.22); border:1px solid rgba(190,180,222,.22); border-radius:14px; padding:12px; margin:10px 0; }
  .tier.cur { border-color:rgba(214,160,136,.5); }
  .tier h4 { font-size:15px; color:#efeaf6; margin:0 0 6px; }
  .tier p { font-size:14px; line-height:1.6; margin:4px 0; color:#dbd6e8; }
  .tier p b { color:#c3b8e3; font-weight:600; margin-right:4px; }
  .devo-today { background:linear-gradient(180deg,#2a2740 0%,#211f34 100%); border-color:rgba(190,180,222,.35); }
  .devo-today h3 { color:#e6e0f2; }
  .devo-today .verse { color:#efeaf6; }
  .card.soft { border-color:rgba(205,183,135,.3); background:rgba(205,183,135,.05); }
  /* v3-6 미션 인트로 */
  .skip { display:block; margin:6px auto 0; min-width:120px; min-height:44px; border:none; background:transparent; color:var(--m); font-size:14.5px; cursor:pointer; font-family:inherit; border-radius:22px; }
  .skip.hide { display:none; }

  .islide .mark { font-size:46px; color:var(--p); margin-bottom:10px; opacity:.9; }
  .islide .tagline { color:var(--g); font-size:15px; letter-spacing:1px; margin-bottom:2px; }
  .islide .tagsub { color:var(--m); font-size:13.5px; margin-bottom:18px; }
  .islide h1 { font-size:26px; margin:6px 0 16px; }
  .islide p { font-size:17px; line-height:1.85; margin:12px 0; }
  .islide p b { color:var(--p); }
  .islide .note { font-size:13.5px; color:var(--m); line-height:1.6; margin-top:18px; }
  .islide .vline { text-align:left; margin-top:20px; }

  const X = d => L + (dayNum(d) - d0) / (d1 - d0) * (W - L - R), Y = v => Tp + (hi - v) / (hi - lo) * (H - Tp - B);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="체중 변화 그래프">';
  [lo, (lo + hi) / 2, hi].forEach(v => { s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="rgba(255,255,255,.08)"/><text x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" fill="#a9b4ac" font-size="10.5">' + (+v.toFixed(1)) + '</text>'; });
  if (goal) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(goal) + '" y2="' + Y(goal) + '" stroke="#a9c79a" stroke-dasharray="5 4"/><text x="' + (W - R) + '" y="' + (Y(goal) - 5) + '" text-anchor="end" fill="#a9c79a" font-size="11">목표 ' + goal + 'kg</text>';
  s += '<polyline fill="none" stroke="#b4c9a6" stroke-width="2.5" stroke-linejoin="round" points="' + pts.map(p => X(p.d).toFixed(1) + ',' + Y(p.kg).toFixed(1)).join(' ') + '"/>';
  pts.forEach(p => { s += '<circle cx="' + X(p.d).toFixed(1) + '" cy="' + Y(p.kg).toFixed(1) + '" r="4" fill="#b4c9a6"/>'; });
  s += '<text x="' + L + '" y="' + (H - 6) + '" fill="#a9b4ac" font-size="10.5">' + fmtMD(pts[0].d) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end" fill="#a9b4ac" font-size="10.5">' + fmtMD(pts[pts.length - 1].d) + ' · ' + pts[pts.length - 1].kg + 'kg</text>';
  return s + '</svg>';
}

// 사람에서 정확한 시점은 아직 밝혀지지 않았음. 아래 시간은 연구에서 관찰된 대략의 구간.

];
const AF_ON = 16;
function afStage(h) { let i = 0; AF_STAGES.forEach((s, k) => { if (h >= s.h) i = k; }); return i; }
function afHours() {
  const id = progId(), pr = PROGRAMS[id];
  if (id === 'waterfast' && progActive()) { const st = +S.program.startTs || (new Date(S.program.start + 'T00:00:00').getTime()); return Math.max(0, (now() - st) / 3600e3); }
  if (pr.timer) return timerSec() / 3600;
  return 0;
}
function afSid() { const id = progId(); if (id === 'waterfast') return 'wf' + S.program.start; return S.timer && S.timer.sid ? 't' + S.timer.sid : ''; }
function afSwitch(h) {
  const i = afStage(h), s = AF_STAGES[i], nx = AF_STAGES[i + 1], on = h >= AF_ON;
  const pct = nx ? Math.min(100, (h - s.h) / (nx.h - s.h) * 100) : 100;
  return '<div class="afsw' + (on ? ' on' : '') + '" id="afsw"><div class="row" style="align-items:flex-start;"><div class="knob" role="img" aria-label="자가포식 스위치 ' + (on ? '켜짐' : '꺼짐') + '"><i></i><b>' + (on ? 'ON' : 'OFF') + '</b></div>' +
    '<div class="grow"><p style="margin:0;"><b>' + s.icon + ' ' + s.t + '</b> ' + eviTag(s.e) + '</p><p class="muted" style="margin:2px 0 0;font-size:13px;">' + s.m + '</p></div></div>' +
    (nx ? '<div class="bar thin"><i id="afbar" style="width:' + pct.toFixed(1) + '%"></i></div><p class="muted" style="font-size:12px;margin:4px 0 0;">다음 단계 <b>' + nx.icon + ' ' + nx.t + '</b>까지 ' + fmtLeft(nx.h - h) + '</p>' : '') +
    '<p class="muted" style="font-size:12px;margin:6px 0 0;">※ 사람에게서 정확한 시점은 아직 밝혀지지 않았어요. 노벨상 연구는 효모에서 이루어졌어요. <a href="javascript:void 0" onclick="openHealth(\'auto\')">자가포식이란? →</a></p></div>';
}
function fmtLeft(hrs) { const m = Math.max(0, Math.round(hrs * 60)); return (m >= 60 ? Math.floor(m / 60) + '시간 ' : '') + (m % 60) + '분'; }
function afNoteCard() {
  const n = S.afNote; if (!n || n.sid !== afSid()) return '';
  const s = AF_STAGES.find(x => x.h === n.h); if (!s) return '';
  return '<div class="card afnote" id="afNote"><div class="row" style="align-items:flex-start;"><div class="grow"><p style="margin:0;"><b>🔔 ' + (s.h === AF_ON ? '자가포식 스위치가 켜지기 시작했습니다' : s.t) + '</b></p><p class="muted" style="margin:4px 0 0;">' + s.m + '</p>' +
    (s.h === AF_ON ? '<p class="vline">“' + vt('고린도후서 4:16') + '” <span>— 고린도후서 4:16</span></p>' : '') + '</div><button class="btn sm sec" style="width:auto;" onclick="S.afNote=null;save();rerender()">닫기</button></div></div>';
}
// 단계가 바뀌는 순간 한 번만 알림 (새로고침해도 다시 울리지 않음)
function afCheck(silent) {
  const sid = afSid(); if (!sid) return;
  const h = afHours(), i = afStage(h);
  if (!S.af || S.af.sid !== sid) S.af = { sid, seen:[] };
  let fresh = null;
  AF_STAGES.forEach((s, k) => { if (k > 0 && k <= i && !S.af.seen.includes(s.h)) { S.af.seen.push(s.h); fresh = s; } });
  if (!fresh) return;
  S.afNote = { sid, h:fresh.h }; save();
  if (silent) return;
  const msg = fresh.h === AF_ON ? '🔆 자가포식 스위치가 켜지기 시작했습니다' : fresh.icon + ' ' + fresh.t;
  toast(msg, 4200);
  try { if (window.Notification && Notification.permission === 'granted' && document.hidden) new Notification('Purify', { body:msg, icon:'icons/icon-192.png' }); } catch(e) {}
  if (curTab === 'today' && document.getElementById('afsw')) rerender();
}
function afTick() {
  const sw = document.getElementById('afsw'); if (!sw) return;
  const h = afHours(), i = afStage(h), was = +sw.dataset.stage;
  afCheck();
  if (sw.dataset.stage === undefined || isNaN(was)) sw.dataset.stage = i;
  else if (was !== i) { const box = sw.parentNode; sw.outerHTML = afSwitch(h); const n = document.getElementById('afsw'); if (n) { n.dataset.stage = i; n.classList.add('flip'); } return; }
  const nx = AF_STAGES[i + 1], b = document.getElementById('afbar');
  if (b && nx) b.style.width = Math.min(100, (h - AF_STAGES[i].h) / (nx.h - AF_STAGES[i].h) * 100).toFixed(1) + '%';
}
setInterval(() => { try { if (typeof S !== 'undefined' && S && S.onboarded) { if (curTab === 'today') afTick(); else afCheck(); } } catch(e) {} }, 1000);

function validateBackup(o) {

    if (!isObj(v) || v.version !== 3) return 'v3 데이터 형식이 올바르지 않아요.';
    if (v.profile != null && !isObj(v.profile)) return '프로필 형식이 올바르지 않아요.';
    if (v.days != null && !isObj(v.days)) return '일별 기록 형식이 올바르지 않아요.';
    if (v.weights != null && (!Array.isArray(v.weights) || v.weights.some(w => !w || typeof w.d !== 'string' || typeof w.kg !== 'number'))) return '체중 기록 형식이 올바르지 않아요.';
  }
  if (d.purifyState != null && !isObj(d.purifyState)) return 'purifyState 형식이 올바르지 않아요.';
  if (d.purifyWater != null && (!Array.isArray(d.purifyWater) || d.purifyWater.some(l => !l || typeof l.a !== 'number'))) return '물 기록 형식이 올바르지 않아요.';
  if (d.purifyV2 != null && !isObj(d.purifyV2)) return 'purifyV2 형식이 올바르지 않아요.';
  if (d.purifyV3 == null && d.purifyState == null && d.purifyWater == null && d.purifyV2 == null) return '불러올 기록이 없어요.';
  return '';

// ===================== 시작 =====================
let lastDate = '';
function init() {
  load();
  lastDate = ymd();
  musicUI();
  if (S.onboarded && S.profile.height && S.disclaimerAt) showMain('today');
  else startOnboarding('intro', 'new');
  setInterval(() => {
    tickTimer();
    if (ymd() !== lastDate) { lastDate = ymd(); if (document.getElementById('main').classList.contains('on')) rerender(); }
  }, 1000);
}
init();
// PWA: 서비스 워커 등록 (http/https에서만, 실패해도 앱은 그대로 동작)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', { scope:'./' }).catch(() => {}); });
}
// 저장 공간 보존 요청 (브라우저가 기록을 임의로 지우지 않도록)
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e) {}
</script>
</body>
</html>
