<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<meta name="description" content="말씀과 함께 건강하게 먹고 움직이는 습관을 만드는 앱">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Purify">
<meta name="application-name" content="Purify">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<title>Purify - 정화의 길</title>
<style>
  :root { --p:#d4af77; --p2:#c9a227; --t:#f5f0e8; --m:#a8b0c0; --card:rgba(255,255,255,.055); --line:rgba(212,175,119,.18); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif; background:#07111f; color:var(--t); font-size:16px; line-height:1.55; }
  .app { max-width:480px; margin:0 auto; height:100vh; height:100dvh; background:linear-gradient(180deg,#0a1628 0%,#10233b 55%,#163252 100%); position:relative; overflow:hidden; }
  .app::before { content:''; position:absolute; left:50%; top:0; width:1px; height:100%; background:linear-gradient(transparent,rgba(212,175,119,.22),transparent); pointer-events:none; }
  .view { display:none; flex-direction:column; height:100%; position:relative; z-index:1; }
  .view.on { display:flex; }
  .top { display:flex; align-items:center; gap:8px; padding:calc(8px + env(safe-area-inset-top)) 10px 8px; min-height:60px; }
  .brand { flex:1; text-align:center; color:var(--p); font-weight:700; letter-spacing:3px; font-size:15px; }
  .iconbtn { width:48px; height:48px; border-radius:24px; border:none; background:transparent; color:var(--p); font-size:28px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit; }
  .iconbtn.sm { font-size:20px; }
  .iconbtn.hide { visibility:hidden; }
  .dots { flex:1; display:flex; justify-content:center; gap:7px; }
  .dot { width:8px; height:8px; border-radius:4px; background:rgba(255,255,255,.18); transition:all .25s; }
  .dot.done { background:rgba(212,175,119,.55); }
  .dot.on { background:var(--p); width:22px; }
  .body { flex:1; overflow-y:auto; padding:6px 20px 28px; -webkit-overflow-scrolling:touch; }
  .foot { padding:10px 20px calc(16px + env(safe-area-inset-bottom)); }
  h1 { font-size:27px; color:var(--p); line-height:1.35; margin:6px 0 10px; font-weight:700; }
  h2 { font-size:23px; color:var(--p); margin:4px 0 6px; line-height:1.35; }
  h3 { font-size:17.5px; color:var(--t); margin-bottom:6px; }
  .lead { color:var(--m); font-size:15.5px; margin-bottom:18px; }
  .btn { display:block; width:100%; min-height:56px; padding:14px; border:none; border-radius:16px; background:linear-gradient(135deg,var(--p2),var(--p)); color:#0a1628; font-weight:700; font-size:17px; cursor:pointer; margin-top:10px; font-family:inherit; }
  .btn:disabled { opacity:.4; }
  .btn.sec { background:transparent; color:var(--p); border:1.5px solid rgba(212,175,119,.6); }
  .btn.ghost { background:rgba(255,255,255,.05); color:var(--t); border:1px solid var(--line); font-weight:600; }
  .btn.sm { min-height:48px; font-size:15.5px; padding:10px; }
  .opt { display:block; width:100%; min-height:64px; text-align:left; padding:14px 16px; margin-bottom:12px; border-radius:16px; border:1.5px solid var(--line); background:var(--card); color:var(--t); font-size:17px; cursor:pointer; font-family:inherit; line-height:1.45; }
  .opt small { display:block; color:var(--m); font-size:14px; margin-top:3px; }
  .opt.sel { border-color:var(--p); background:rgba(212,175,119,.14); box-shadow:0 0 0 1px var(--p) inset; }
  .opt.dis { opacity:.5; }
  .seg { display:flex; gap:10px; } .seg .opt { flex:1; text-align:center; margin-bottom:0; }
  label.f { display:block; font-size:14.5px; color:var(--m); margin:16px 0 6px; }
  .inp { width:100%; min-height:54px; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.06); color:#fff; border:1.5px solid var(--line); font-size:17px; font-family:inherit; }
  .inp:focus { outline:none; border-color:var(--p); }
  textarea.inp { min-height:96px; line-height:1.5; resize:vertical; }
  select.inp { appearance:none; }
  .unit { position:relative; } .unit .inp { padding-right:48px; } .unit span { position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--m); pointer-events:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px 16px; margin-bottom:14px; }
  .card.hl { border-color:rgba(212,175,119,.55); background:rgba(212,175,119,.08); }
  .verse { font-size:17px; line-height:1.75; }
  .ref { color:var(--p); font-size:14px; margin-top:6px; }
  .explain { background:rgba(255,255,255,.05); border-radius:14px; padding:12px 14px; margin-top:8px; font-size:15.5px; color:#e8e2d6; }
  .apply { margin-top:12px; font-size:15.5px; } .apply b { color:var(--p); }
  .warn { background:rgba(220,80,60,.13); border:1px solid rgba(230,100,80,.55); color:#ffcabf; border-radius:16px; padding:12px 14px; font-size:15px; margin:10px 0; }
  .good { background:rgba(120,200,150,.1); border:1px solid rgba(120,200,150,.4); color:#d3efdf; border-radius:16px; padding:12px 14px; font-size:15px; margin:10px 0; }
  .muted { color:var(--m); font-size:14.5px; }
  .row { display:flex; gap:10px; align-items:center; }
  .row > .btn { margin-top:0; }
  .grow { flex:1; min-width:0; }
  .stats { display:flex; gap:10px; margin:6px 0; }
  .stat { flex:1; text-align:center; background:rgba(255,255,255,.045); border-radius:16px; padding:12px 4px; }
  .stat b { display:block; font-size:21px; color:var(--p); line-height:1.3; }
  .stat span { font-size:12.5px; color:var(--m); }
  .bar { height:10px; background:rgba(255,255,255,.1); border-radius:5px; overflow:hidden; margin:8px 0; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--p2),var(--p)); transition:width .3s; }
  .item { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid rgba(255,255,255,.07); }
  .item:first-of-type { border-top:none; }
  .item .txt { flex:1; min-width:0; }
  .item .txt b { font-size:16px; }
  .item .txt div { font-size:14.5px; color:#ddd5c6; }
  .item .txt small { color:var(--m); font-size:13px; }
  .ic { font-size:28px; width:36px; text-align:center; flex:none; }
  .tick { flex:none; width:54px; height:54px; border-radius:27px; border:2px solid rgba(212,175,119,.6); background:transparent; color:var(--p); font-size:22px; cursor:pointer; font-family:inherit; }
  .tick.on { background:var(--p); color:#0a1628; border-color:var(--p); }
  .chip { display:inline-block; min-height:46px; padding:10px 14px; margin:0 6px 8px 0; border-radius:23px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--t); font-size:15px; cursor:pointer; font-family:inherit; }
  .chk { display:flex; align-items:center; gap:14px; min-height:56px; padding:6px 0; border-top:1px solid rgba(255,255,255,.07); font-size:16px; cursor:pointer; }
  .chk:first-of-type { border-top:none; }
  .chk input { width:26px; height:26px; accent-color:#d4af77; flex:none; }
  .nav { display:flex; height:calc(68px + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); background:rgba(8,18,34,.97); border-top:1px solid rgba(212,175,119,.25); }
  .nav button { flex:1; border:none; background:transparent; color:var(--m); font-size:13px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .nav button i { font-style:normal; font-size:22px; line-height:1; }
  .nav button.on { color:var(--p); font-weight:700; }
  .screen { display:none; } .screen.on { display:block; }
  .toast { position:absolute; left:50%; bottom:96px; transform:translateX(-50%); background:rgba(10,22,40,.97); border:1px solid var(--p); padding:12px 16px; border-radius:16px; z-index:200; opacity:0; transition:opacity .25s; pointer-events:none; width:max-content; max-width:300px; text-align:center; font-size:15px; }
  .toast.show { opacity:1; }
  details > summary { cursor:pointer; color:var(--p); min-height:48px; display:flex; align-items:center; font-weight:600; list-style:none; font-size:15.5px; }
  details > summary::-webkit-details-marker { display:none; }
  details > summary::after { content:'›'; margin-left:auto; font-size:22px; transition:transform .2s; }
  details[open] > summary::after { transform:rotate(90deg); }
  ul.l { margin:6px 0 4px 20px; } ul.l li { margin:4px 0; }
  .badge { display:inline-block; background:linear-gradient(135deg,var(--p2),var(--p)); color:#0a1628; font-size:12.5px; font-weight:700; padding:3px 10px; border-radius:20px; margin-left:6px; vertical-align:middle; }
  .tag { display:inline-block; font-size:12.5px; color:var(--p); border:1px solid rgba(212,175,119,.45); padding:2px 9px; border-radius:20px; margin:6px 4px 0 0; }
  .hero { text-align:center; padding-top:9vh; }
  .hero .mark { font-size:56px; color:var(--p); margin-bottom:6px; }
  .hero p { font-size:17.5px; line-height:1.8; margin:14px 0; }
  .timer { font-size:42px; font-weight:300; letter-spacing:2px; text-align:center; color:var(--p); font-variant-numeric:tabular-nums; margin:4px 0; }
  .sec-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
  .sec-title h3 { margin:0; }
  .link { background:none; border:none; color:var(--p); font-size:15px; cursor:pointer; min-height:44px; padding:0 4px; font-family:inherit; }
  .ringwrap { display:flex; align-items:center; gap:16px; }
  .prayer { background:rgba(212,175,119,.08); border-left:3px solid var(--p); border-radius:10px; padding:12px 14px; margin-top:10px; font-size:15.5px; line-height:1.7; }
  .share-pre { white-space:pre-wrap; font-size:14px; background:rgba(0,0,0,.25); border-radius:14px; padding:12px; color:#e8e2d6; max-height:240px; overflow:auto; }
  .member { border-top:1px solid rgba(255,255,255,.07); padding:10px 0; }
  .member .inp { margin-top:8px; min-height:48px; font-size:15.5px; }
  .musicbtn { position:absolute; top:calc(14px + env(safe-area-inset-top)); right:10px; z-index:60; width:44px; height:44px; border-radius:22px; border:1px solid rgba(212,175,119,.45); background:rgba(10,22,40,.75); color:var(--p); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .musicbtn.off { color:var(--m); opacity:.7; }
  .musicbtn.off::after { content:''; position:absolute; width:26px; height:2px; background:var(--m); transform:rotate(-45deg); border-radius:1px; }
</style>
</head>
<body>
<div class="app">

  <div id="ob" class="view">
    <div class="top">
      <button class="iconbtn" id="obBack" onclick="obPrev()" aria-label="뒤로">‹</button>
      <div class="dots" id="obDots"></div>
      <div style="width:48px"></div>
    </div>
    <div class="body" id="obBody"></div>
    <div class="foot"><button class="btn" id="obNext" onclick="obNextStep()">다음</button></div>
  </div>

  <div id="main" class="view">
    <div class="top">
      <button class="iconbtn hide" id="mainBack" onclick="goBack()" aria-label="뒤로">‹</button>
      <div class="brand">PURIFY</div>
      <button class="iconbtn sm" onclick="shareToday()" aria-label="오늘 요약 공유">⤴</button>
      <div style="width:46px"></div>
    </div>
    <div class="body" id="mainBody">
      <div class="screen" id="s-today"></div>
      <div class="screen" id="s-history"></div>
      <div class="screen" id="s-word"></div>
      <div class="screen" id="s-seek"></div>
      <div class="screen" id="s-me"></div>
    </div>
    <nav class="nav">
      <button data-tab="today" onclick="showTab('today')"><i>☀</i>오늘</button>
      <button data-tab="history" onclick="showTab('history')"><i>📈</i>기록</button>
      <button data-tab="word" onclick="showTab('word')"><i>📖</i>말씀</button>
      <button data-tab="me" onclick="showTab('me')"><i>👤</i>나</button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>
  <button id="musicBtn" class="musicbtn" onclick="musicToggle()" aria-pressed="true" aria-label="배경 음악 끄기" title="배경 음악 끄기">♪</button>
</div>
<script>
'use strict';
// ===================== 데이터 =====================
// 말씀: 개역한글(저작권 보호기간 만료) 본문 · e: 쉽게 풀어보기 · a: 오늘의 실천
const VERSES = [
  { t:'그런즉 너희가 먹든지 마시든지 무엇을 하든지 다 하나님의 영광을 위하여 하라', r:'고린도전서 10:31', e:'먹고 마시는 평범한 일상도 의미 있게 살 수 있다는 말이에요. 식사는 감사하며 누리는 선물이에요.', a:'오늘 한 끼는 휴대폰을 내려놓고 천천히, 감사하며 먹어 보세요.' },
  { t:'너희 몸은 너희가 하나님께로부터 받은 바 너희 가운데 계신 성령의 전인 줄을 알지 못하느냐 너희는 너희의 것이 아니라 값으로 산 것이 되었으니 그런즉 너희 몸으로 하나님께 영광을 돌리라', r:'고린도전서 6:19-20', e:'내 몸은 아주 귀하게 맡겨진 선물이라는 뜻이에요. 몸을 아끼고 돌보는 것 자체가 소중한 일이에요.', a:'내 몸을 위해 오늘 물 한 잔을 더 마셔요.' },
  { t:'그런즉 누구든지 그리스도 안에 있으면 새로운 피조물이라 이전 것은 지나갔으니 보라 새 것이 되었도다', r:'고린도후서 5:17', e:'누구든지 새롭게 시작할 수 있다는 말이에요. 지난 실패가 나를 정의하지 않아요.', a:'오늘을 새 출발의 첫날로 정하고, 작은 목표 하나를 적어 보세요.' },
  { t:'예수께서 대답하여 가라사대 진실로 진실로 네게 이르노니 사람이 거듭나지 아니하면 하나님 나라를 볼 수 없느니라', r:'요한복음 3:3', e:'“거듭난다”는 건 마음이 새롭게 태어나는 것을 말해요. 몸의 습관이 바뀌듯 마음도 새로워질 수 있어요.', a:'오늘 바꾸고 싶은 습관 하나를 정해 보세요.' },
  { t:'내가 내 몸을 쳐 복종하게 함은 내가 남에게 전파한 후에 자기가 도리어 버림이 될까 두려워함이로다', r:'고린도전서 9:27', e:'바울은 운동선수처럼 자기 몸을 훈련했어요. 절제는 벌이 아니라 목표를 향한 연습이에요.', a:'오늘의 운동 하나를 끝까지 해 봐요.' },
  { t:'오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과 온유와 절제니 이같은 것을 금지할 법이 없느니라', r:'갈라디아서 5:22-23', e:'사랑, 기쁨, 평화… 그리고 절제. 좋은 열매는 억지로 짜내는 게 아니라 천천히 자라나는 거예요.', a:'작은 절제 하나만 해 봐요. 예: 야식 대신 따뜻한 차.' },
  { t:'금식할 때에 너희는 외식하는 자들과 같이 슬픈 기색을 내지 말라 저희는 금식하는 것을 사람에게 보이려고 얼굴을 흉하게 하느니라', r:'마태복음 6:16', e:'절제나 금식을 남에게 보여 주려고 하지 말라는 말이에요. 조용히, 나를 위해 하면 충분해요.', a:'오늘의 노력은 자랑 대신 조용히 기록만 해 봐요.' },
  { t:'너는 금식할 때에 머리에 기름을 바르고 얼굴을 씻으라 이는 금식하는 자로 사람에게 보이지 않고 오직 은밀한 중에 계신 네 아버지께 보이게 하려 함이라 은밀한 중에 보시는 네 아버지께서 갚으시리라', r:'마태복음 6:17-18', e:'힘든 티를 내기보다 단정하게 하루를 보내라는 뜻이에요. 아무도 몰라도 그 노력은 의미가 있어요.', a:'아침에 세수하고 거울 속 나에게 한 번 웃어 주세요.' },
  { t:'나의 기뻐하는 금식은 흉악의 결박을 풀어 주며 멍에의 줄을 끌러 주며 압제 당하는 자를 자유케 하며 모든 멍에를 꺾는 것이 아니겠느냐', r:'이사야 58:6', e:'진짜 금식은 굶는 것 자체보다, 나와 이웃을 묶고 있는 것을 풀어 주는 데 있다고 말해요.', a:'오늘 아낀 간식비로 누군가에게 작은 친절을 베풀어 보세요.' },
  { t:'여호와의 말씀에 너희는 이제라도 금식하며 울며 애통하고 마음을 다하여 내게로 돌아오라 하셨나니', r:'요엘 2:12', e:'“이제라도” — 늦었다고 생각할 때가 다시 시작할 때라는 따뜻한 초대예요.', a:'어제 못 했어도 괜찮아요. 오늘 다시 시작해요.' },
  { t:'예수께서 대답하여 가라사대 기록되었으되 사람이 떡으로만 살 것이 아니요 하나님의 입으로 나오는 모든 말씀으로 살 것이라 하였느니라 하시니', r:'마태복음 4:4', e:'사람은 밥만으로 사는 게 아니라 마음을 채워 주는 말로도 산다는 뜻이에요.', a:'배고픔이 몰려올 때 이 구절을 한 번 소리 내어 읽어 보세요.' },
  { t:'내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라', r:'빌립보서 4:13', e:'혼자 힘으로 버거울 때 힘을 주시는 분이 함께한다는 고백이에요.', a:'미뤄 둔 일 하나를 오늘 시도해 보세요.' },

    '<details><summary>혈압 · 혈당 참고 기준</summary><p class="muted">수축기 혈압 120 미만 정상 · 140 이상 고혈압 범위 · 90 이하 저혈압 주의<br>공복 혈당 70~99 정상 · 100~125 당뇨 전 단계 · 126 이상 주의 · 70 미만 저혈당</p></details></div>';
  h += '<div class="card"><div class="sec-title"><h3>🎵 배경 음악</h3><span class="muted" id="musicState">' + (musicOn() ? '켜짐' : '꺼짐') + '</span></div><p class="muted">직접 만든 잔잔한 피아노 음악이에요 (저작권 걱정 없음). 화면을 나가면 자동으로 멈춰요.</p><button class="btn sm sec" id="musicSet" onclick="musicToggle()">' + (musicOn() ? '음악 끄기' : '음악 켜기') + '</button></div>';
  h += '<button class="btn ghost" onclick="resetAll()" style="opacity:.8;">모든 기록 초기화</button><p class="muted" style="text-align:center; margin-top:12px;">Purify v3 · 성경 본문 개역한글</p>';
  el.innerHTML = h;
}
// ===================== 배경 음악 (직접 합성한 저작권 없는 음악) =====================
// 파일 구조: [끝 0.5초 | 80초 루프 | 처음 0.5초] → 두 인스턴스를 60ms 크로스페이드로 이어 붙여 끊김·클릭 없이 반복
const MUSIC_KEY = 'purifyMusic', MUSIC_VOL = 0.35, M_PAD = 0.5, M_LEN = 80, M_XF = 0.06, M_FADE = 2.5;
const Music = { ctx:null, gain:null, buf:null, loading:null, nextT:0, timer:0, started:false, want:false, el:null, mode:'', srcs:[] };
function musicOn() { try { return localStorage.getItem(MUSIC_KEY) !== 'off'; } catch(e) { return true; } }
function musicSetPref(on) { try { localStorage.setItem(MUSIC_KEY, on ? 'on' : 'off'); } catch(e) {} }
function musicUI() {
  const on = musicOn(), b = document.getElementById('musicBtn');
  if (b) { b.classList.toggle('off', !on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.setAttribute('aria-label', on ? '배경 음악 끄기' : '배경 음악 켜기'); b.title = on ? '배경 음악 끄기' : '배경 음악 켜기'; }
  const s = document.getElementById('musicSet'); if (s) s.textContent = on ? '음악 끄기' : '음악 켜기';
  const st = document.getElementById('musicState'); if (st) st.textContent = on ? '켜짐' : '꺼짐';
}
function musicFade(v, sec) {
  if (Music.mode === 'ctx' && Music.gain) {
    const g = Music.gain.gain, t = Music.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(v, t + sec);
  } else if (Music.mode === 'el' && Music.el) {
    const a = Music.el, from = a.volume, t0 = now(); clearInterval(Music.elFade);
    Music.elFade = setInterval(() => { const k = Math.min(1, (now() - t0) / (sec * 1000)); try { a.volume = from + (v - from) * k; } catch(e) {} if (k >= 1) clearInterval(Music.elFade); }, 50);
  }
}
function musicLoad() {
  if (Music.buf) return Promise.resolve(Music.buf);
  if (Music.loading) return Music.loading;
  Music.loading = fetch('audio/purify-bgm.mp3').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
    .then(ab => new Promise((res, rej) => { const p = Music.ctx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); }))
    .then(b => (Music.buf = b));
  Music.loading.catch(() => { Music.loading = null; });
  return Music.loading;
}
function musicInstance(T, first) {
  const c = Music.ctx, src = c.createBufferSource(), g = c.createGain();
  src.buffer = Music.buf; src.connect(g); g.connect(Music.gain);
  const h = M_XF / 2;
  if (first) { g.gain.setValueAtTime(1, T); src.start(T, M_PAD); }
  else { g.gain.setValueAtTime(0, T - h); g.gain.linearRampToValueAtTime(1, T + h); src.start(T - h, M_PAD - h); }
  g.gain.setValueAtTime(1, T + M_LEN - h); g.gain.linearRampToValueAtTime(0, T + M_LEN + h);
  src.stop(T + M_LEN + h + 0.02);
  Music.srcs.push(src); src.onended = () => { Music.srcs = Music.srcs.filter(s => s !== src); };
}
function musicSchedule() {
  if (Music.mode !== 'ctx' || !Music.started) return;
  while (Music.nextT - Music.ctx.currentTime < 4) { musicInstance(Music.nextT, false); Music.nextT += M_LEN; }
}
function musicFallback() {
  Music.mode = 'el';
  if (!Music.el) {
    const a = document.createElement('audio');
    a.src = a.canPlayType && a.canPlayType('audio/mp4; codecs="mp4a.40.2"') ? 'audio/purify-bgm.m4a' : 'audio/purify-bgm.mp3';
    a.preload = 'auto'; a.volume = 0;
    a.addEventListener('timeupdate', () => { if (a.currentTime >= M_PAD + M_LEN) a.currentTime -= M_LEN; });
    a.addEventListener('ended', () => { a.currentTime = M_PAD; const p = a.play(); if (p && p.catch) p.catch(() => {}); });
    Music.el = a;
  }
  const a = Music.el; try { if (a.currentTime < M_PAD) a.currentTime = M_PAD; } catch(e) {}
  const p = a.play(); if (p && p.then) p.then(() => musicFade(MUSIC_VOL, M_FADE), () => {}); else musicFade(MUSIC_VOL, M_FADE);
}
// 사용자 제스처 안에서 호출되어야 함 (자동재생 정책)
function musicStart() {
  if (!musicOn()) return;
  Music.want = true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || Music.mode === 'el') return musicFallback();
  try {
    if (!Music.ctx) { Music.ctx = new AC(); Music.gain = Music.ctx.createGain(); Music.gain.gain.value = 0; Music.gain.connect(Music.ctx.destination); }
    Music.mode = 'ctx';
    const c = Music.ctx;
    try { const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0); } catch(e) {} // iOS 잠금 해제
    if (c.state === 'suspended' && c.resume) c.resume().catch(() => {});
    musicLoad().then(() => {
      if (!Music.want || document.hidden) return;
      if (!Music.started) {
        Music.started = true; const T = c.currentTime + 0.05;
        musicInstance(T, true); Music.nextT = T + M_LEN;
        clearInterval(Music.timer); Music.timer = setInterval(musicSchedule, 1000); musicSchedule();
      }
      musicFade(MUSIC_VOL, M_FADE);
    }).catch(() => { Music.mode = ''; musicFallback(); });
  } catch(e) { musicFallback(); }
}
function musicStop(fadeSec) {
  Music.want = false;
  musicFade(0, fadeSec || 0.6);
  setTimeout(() => {
    if (Music.want) return;
    if (Music.mode === 'ctx' && Music.ctx && Music.ctx.state === 'running' && Music.ctx.suspend) Music.ctx.suspend().catch(() => {});
    if (Music.mode === 'el' && Music.el) Music.el.pause();
  }, (fadeSec || 0.6) * 1000 + 80);
}
function musicToggle() {
  const on = !musicOn(); musicSetPref(on); musicUI();
  if (on) { musicStart(); toast('🎵 배경 음악을 켰어요.'); } else { musicStop(); toast('배경 음악을 껐어요.'); }
}
function musicGesture(e) {
  if (e && e.target && e.target.closest && e.target.closest('#musicBtn, #musicSet')) return;
  if (Music.want || !musicOn()) return;
  musicStart();
}
['click', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, musicGesture, true));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (Music.mode === 'ctx' && Music.ctx && Music.ctx.state === 'running') { Music.gain.gain.cancelScheduledValues(Music.ctx.currentTime); Music.gain.gain.setValueAtTime(0, Music.ctx.currentTime); Music.ctx.suspend().catch(() => {}); }
    if (Music.mode === 'el' && Music.el) Music.el.pause();
  } else if (Music.want && musicOn()) {
    if (Music.mode === 'ctx' && Music.ctx) { Music.ctx.resume().then(() => musicFade(MUSIC_VOL, 1.5)).catch(() => {}); }
    else if (Music.mode === 'el' && Music.el) { Music.el.volume = 0; const p = Music.el.play(); if (p && p.then) p.then(() => musicFade(MUSIC_VOL, 1.5), () => {}); }
  }
});
// ===================== 소그룹 (이 기기에만 저장) =====================
function groupCard() {
  const g = S.group, T = ymd(), t = g.notes[T] || {};
  return '<div class="card"><h3>👥 소그룹 <span class="tag">이 기기에만 저장</span></h3>' +
    '<p style="font-size:14px; color:#ffcabf; margin:4px 0 8px;">서버가 없어 다른 사람과 동기화되지 않아요. 공유 버튼으로 요약을 보내 주세요.</p>' +
    '<div class="row"><input class="inp grow" id="grpName" placeholder="그룹 이름" value="' + esc(g.name) + '"><button class="btn sec" style="width:80px;" onclick="saveGroupName()">저장</button></div>' +
    '<div class="row" style="margin-top:8px;"><input class="inp grow" id="memName" placeholder="멤버 이름"><button class="btn sec" style="width:80px;" onclick="addMember()">추가</button></div>' +
    (g.members.length ? '<p class="muted" style="margin-top:10px;">오늘(' + fmtMD(T) + ')의 응원 · 기도 제목</p>' : '') +
    g.members.map(m => { const n = t[m.id] || {}; return '<div class="member"><div class="row"><b class="grow">' + esc(m.name) + '</b><button class="link" onclick="removeMember(\'' + m.id + '\')">삭제</button></div>' +
      '<input class="inp" placeholder="응원 메시지" value="' + esc(n.cheer || '') + '" onchange="setMemberNote(\'' + m.id + '\',\'cheer\',this.value)">' +
      '<input class="inp" placeholder="기도 제목" value="' + esc(n.prayer || '') + '" onchange="setMemberNote(\'' + m.id + '\',\'prayer\',this.value)"></div>'; }).join('') + '</div>';
}
function saveGroupName() { S.group.name = document.getElementById('grpName').value.trim(); save(); toast('그룹 이름을 저장했어요.'); rerender(); }
function addMember() {
  const el = document.getElementById('memName'), n = el.value.trim();
  if (!n) return alert('멤버 이름을 입력해 주세요.');
  S.group.members.push({ id:'m' + now().toString(36) + Math.floor(Math.random() * 1000), name:n.slice(0, 20) }); save(); rerender();
}
function removeMember(id) {
  const m = S.group.members.find(x => x.id === id); if (!m || !confirm(m.name + ' 님을 삭제할까요?')) return;
  S.group.members = S.group.members.filter(x => x.id !== id); save(); rerender();
}
function setMemberNote(id, f, v) { const T = ymd(), t = S.group.notes[T] || (S.group.notes[T] = {}); t[id] = t[id] || {}; t[id][f] = v.trim(); save(); }

// ===================== 공유 =====================
function buildShareText() {
  const T = ymd(), v = verseFor(T), P = plan(), pr = PROGRAMS[progId()], x = day(T);
  const L = ['✦ Purify 정화의 길 · ' + fmtMD(T)];
  if (S.group.name) L.push('[' + S.group.name + ']');
  L.push('', (S.name ? S.name + '의 ' : '') + '오늘: ' + pr.name + ' ' + (progActive(T) ? progDay(T) + '/' + pr.days + '일차' : '완주') + (S.program.done ? ' 🏅' : ''));
  L.push('🍽 ' + comma(eatenKcal(T)) + ' / ' + comma(P.target) + 'kcal · 🏃 ' + burnedKcal(T) + 'kcal · 💧 ' + (x.water / 1000).toFixed(1) + 'L');
  L.push('', '📖 오늘의 말씀', '“' + v.t + '”', '— ' + v.r, '', '💡 쉽게: ' + v.e, '✔ 오늘의 실천: ' + v.a);
  const t = S.group.notes[T] || {};
  const lines = S.group.members.map(m => { const n = t[m.id] || {}, ps = []; if (n.cheer) ps.push('응원: ' + n.cheer); if (n.prayer) ps.push('기도: ' + n.prayer); return ps.length ? '- ' + m.name + ' · ' + ps.join(' / ') : ''; }).filter(Boolean);
  if (lines.length) L.push('', '👥 함께하는 사람들', ...lines);
  L.push('', '— 말씀과 함께 건강한 몸, 새로운 마음. Purify');
  return L.join('\n');
}
function fallbackCopy(txt) {
  try { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand && document.execCommand('copy'); ta.remove(); return !!ok; } catch(e) { return false; }
}
function shareText(txt, title) {
  if (navigator.share) return navigator.share({ title:title || 'Purify', text:txt }).catch(() => {});
  const done = ok => { if (ok) toast('복사했어요. 카카오톡에 붙여 넣어 보세요.'); else prompt('아래 내용을 복사해 주세요', txt); };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(() => done(true), () => done(fallbackCopy(txt)));
  done(fallbackCopy(txt)); return Promise.resolve();
}
function shareToday() { return shareText(buildShareText(), 'Purify 오늘의 정화'); }
function askFriend() { return shareText('나 요즘 Purify로 건강 습관 만들고 있는데, 앱에 나오는 말씀이 좀 궁금해졌어. 시간 될 때 이야기해 줄래? 🙂', 'Purify'); }

// ===================== 백업 =====================
function exportData() {
  save();
  return { app:'purify', version:3, exportedAt:new Date(now()).toISOString(), data:{ purifyV3:JSON.parse(JSON.stringify(S)), purifyState:lsGet('purifyState'), purifyWater:lsGet('purifyWater'), purifyV2:lsGet('purifyV2') } };
}
function downloadBackup() {
  try {
    const blob = new Blob([JSON.stringify(exportData(), null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'purify-backup-' + ymd() + '.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500); toast('백업 파일을 저장했어요.');
  } catch(e) { alert('내보내기 오류: ' + e.message); }
}
function validateBackup(o) {
  const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
  if (!isObj(o) || o.app !== 'purify') return 'Purify 백업 파일이 아니에요.';
  if (!isObj(o.data)) return '백업 데이터가 없어요.';
  const d = o.data;
  if (d.purifyV3 != null) {
    const v = d.purifyV3;
    if (!isObj(v) || v.version !== 3) return 'v3 데이터 형식이 올바르지 않아요.';
    if (v.profile != null && !isObj(v.profile)) return '프로필 형식이 올바르지 않아요.';
    if (v.days != null && !isObj(v.days)) return '일별 기록 형식이 올바르지 않아요.';
    if (v.weights != null && (!Array.isArray(v.weights) || v.weights.some(w => !w || typeof w.d !== 'string' || typeof w.kg !== 'number'))) return '체중 기록 형식이 올바르지 않아요.';
  }
  if (d.purifyState != null && !isObj(d.purifyState)) return 'purifyState 형식이 올바르지 않아요.';
  if (d.purifyWater != null && (!Array.isArray(d.purifyWater) || d.purifyWater.some(l => !l || typeof l.a !== 'number'))) return '물 기록 형식이 올바르지 않아요.';
  if (d.purifyV2 != null && !isObj(d.purifyV2)) return 'purifyV2 형식이 올바르지 않아요.';
  if (d.purifyV3 == null && d.purifyState == null && d.purifyWater == null && d.purifyV2 == null) return '불러올 기록이 없어요.';
  return '';
}
function applyBackup(o, skipConfirm) {
  const err = validateBackup(o);
  if (err) { alert('가져오기 실패: ' + err); return false; }
  if (!skipConfirm && !confirm('백업(' + (o.exportedAt ? o.exportedAt.slice(0, 10) : '날짜 없음') + ')을 불러올까요?\n지금 기기의 기록은 모두 덮어써져요.')) return false;
  const d = o.data;
  try {
    if (d.purifyV3 != null) localStorage.setItem(KEY, JSON.stringify(d.purifyV3)); else localStorage.removeItem(KEY);
    LEGACY.forEach(k => { if (d[k] != null) localStorage.setItem(k, JSON.stringify(d[k])); else localStorage.removeItem(k); });
  } catch(e) { alert('저장 오류: ' + e.message); return false; }
  try { location.reload(); } catch(e) {}
  return true;
}
function importFromFile(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { let o; try { o = JSON.parse(r.result); } catch(e) { input.value = ''; return alert('가져오기 실패: JSON 파일을 읽을 수 없어요.'); } applyBackup(o); input.value = ''; };
  r.readAsText(f);
}
function resetAll() {
  if (!confirm('모든 기록(프로필, 식단, 체중, 프로그램, 그룹 등)을 지울까요? 되돌릴 수 없어요.')) return;
  lsDel(KEY); LEGACY.forEach(lsDel); lsDel('purifyMusic');
  try { location.reload(); } catch(e) {}
}

  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', { scope:'./' }).catch(() => {}); });
}

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e) {}
